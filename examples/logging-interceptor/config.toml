[component.logging-greeter]
uri = "factory:logging-greeter-factory"
imports = ["greeter", "logger"]

[component.greeter]
uri = "./lib/hello.wasm"

[component.logger]
uri = "oci://ghcr.io/componentized/logging/to-stdout:v0.2.1"
imports = ["wasip2"]

[component.logging-greeter-factory]
uri = "./lib/logging-interceptor-factory.wasm"
imports = ["loader"]
config.target = "/lib/hello.wasm"

[component.loader]
uri = "oci://ghcr.io/modulewise/component/filesystem-loader:0.4.0"
imports = ["filesystem"]

[capability.filesystem]
type = "wasi:filesystem"

[[capability.filesystem.preopens]]
host = "./lib"
guest = "/lib"
perms = "read-only"

[capability.wasip2]
type = "wasi:p2"
