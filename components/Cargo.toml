[workspace]
members = [
    "filesystem-loader",
    "json-mapper",
    "templated-http-client",
    "url-api-factory",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/modulewise/composable-factory"

[workspace.dependencies]
http-api-adapter = { path = "../crates/http-api-adapter" }
serde_json = "1"
wit-bindgen = "0.63"
