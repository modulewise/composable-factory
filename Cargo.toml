[package]
name = "composable-factory"
description = "Build Wasm Components with Wasm Components"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/modulewise/composable-factory"
readme = "README.md"
categories = ["wasm"]
keywords = ["wasm", "webassembly", "wit"]

[workspace]
members = [
    ".",
    "crates/http-api-adapter",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
composable-factory = { path = "." }
wit-parser = "0.263"

[dependencies]
anyhow.workspace = true
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
wasm-encoder = "0.263"
wasmparser = "0.263"
wit-component = "0.263"
wit-parser.workspace = true

[dev-dependencies]
wasmtime = "50"
