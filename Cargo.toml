[package]
name = "composable-factory"
description = "Build Wasm Components with Wasm Components"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/modulewise/composable-factory"
readme = "README.md"
categories = ["wasm"]
keywords = ["wasm", "webassembly", "wit"]

[dependencies]
anyhow = "1"
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
wasm-encoder = "0.258"
wasmparser = "0.258"
wit-component = "0.258"
wit-parser = "0.258"
